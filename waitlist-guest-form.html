<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Waitlist – Dodie's Cajun Diner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#DC143C;--dark-red:#8B0000;--black:#0A0A0A;--dark-gray:#1A1A1A;--light-gray:#CCCCCC;--white:#FFFFFF;--gold:#D4AF37}
body{font-family:'Open Sans',sans-serif;background:var(--black);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{max-width:520px;width:100%}
.card{background:var(--dark-gray);border:2px solid var(--red);border-radius:16px;padding:40px 36px;box-shadow:0 12px 48px rgba(0,0,0,.8)}
.header{text-align:center;margin-bottom:32px}
.logo{font-size:64px;display:block;margin-bottom:20px;filter:drop-shadow(0 4px 12px rgba(220,20,60,.5))}
h1{font-family:'Montserrat',sans-serif;font-size:32px;font-weight:800;color:var(--red);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.subtitle{font-size:15px;color:var(--light-gray)}

/* Live seafood button */
.seafood-btn-wrap{text-align:center;margin-top:20px}
.seafood-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:2px solid var(--red);border-radius:999px;background:linear-gradient(135deg,rgba(220,20,60,.22),rgba(139,0,0,.12));color:#ffe4b5;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;letter-spacing:.04em;cursor:pointer;text-decoration:none;transition:all .25s ease;box-shadow:0 0 12px rgba(220,20,60,.25);animation:cajunPulse 2.5s ease-in-out infinite}
.seafood-btn:hover{background:linear-gradient(135deg,rgba(220,20,60,.38),rgba(139,0,0,.22));border-color:#f0c040;box-shadow:0 0 18px rgba(240,192,64,.30);transform:translateY(-2px);color:#fff}
.seafood-btn .dot{width:8px;height:8px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 6px #ff6b6b;animation:dotBlink 1.4s ease-in-out infinite}
@keyframes cajunPulse{0%,100%{box-shadow:0 0 12px rgba(220,20,60,.25),0 0 30px rgba(220,20,60,.08)}50%{box-shadow:0 0 18px rgba(220,20,60,.35),0 0 40px rgba(220,20,60,.15)}}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.5}}

/* Spicy meter */
.spicy-meter{background:var(--black);border:1px solid #333;border-radius:12px;padding:18px 16px;margin-bottom:20px}
.spicy-header{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;color:var(--light-gray);text-transform:uppercase;letter-spacing:.5px}
.spicy-options{display:flex;gap:8px}
.spicy-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:2px solid #333;border-radius:10px;background:transparent;cursor:pointer;transition:all .25s ease}
.spicy-opt:hover{border-color:#555;background:rgba(255,255,255,.03)}
.spicy-opt.selected{border-color:var(--red);background:rgba(220,20,60,.12);box-shadow:0 0 14px rgba(220,20,60,.18)}
.spicy-opt .fire{font-size:22px;line-height:1;min-height:28px;display:flex;align-items:center;justify-content:center}
.spicy-opt .fire-label{font-size:11px;font-weight:700;font-family:'Montserrat',sans-serif;color:var(--light-gray);text-transform:uppercase;letter-spacing:.3px;text-align:center;line-height:1.2}
.spicy-opt.selected .fire-label{color:var(--white)}
.no-spice-dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 6px rgba(220,20,60,.5)}
.spicy-opt.selected .fire{animation:fireWiggle .4s ease}
@keyframes fireWiggle{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-5deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1)}}

.form-group{margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;color:var(--light-gray);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.required{color:var(--red)}
input,textarea{width:100%;padding:14px 16px;background:var(--black);border:1px solid #333;border-radius:8px;color:var(--white);font-size:15px;font-family:'Open Sans',sans-serif;transition:all 0.2s ease}
input::placeholder,textarea::placeholder{color:#666}
input:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(220,20,60,.2)}
textarea{min-height:90px;resize:vertical}

.consent-box{background:var(--black);border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:20px}
.checkbox-item{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.checkbox-item:last-child{margin-bottom:0}
.checkbox-item input[type="checkbox"]{width:20px;height:20px;margin-top:2px;cursor:pointer;flex-shrink:0;accent-color:var(--red)}
.checkbox-label{font-size:13px;color:var(--light-gray);line-height:1.6;cursor:pointer}
.checkbox-label strong{color:var(--white)}

.submit-btn{width:100%;padding:16px 24px;background:var(--red);border:none;border-radius:8px;color:var(--white);font-size:16px;font-weight:700;font-family:'Montserrat',sans-serif;text-transform:uppercase;cursor:pointer;transition:all 0.2s ease;letter-spacing:.5px}
.submit-btn:hover:not(:disabled){background:var(--dark-red);transform:translateY(-2px);box-shadow:0 8px 24px rgba(220,20,60,.4)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}

.status-message{display:none;margin-top:16px;padding:14px 16px;border-radius:8px;font-size:14px;font-weight:600}
.status-message.show{display:block}
.status-message.error{background:rgba(220,20,60,.15);border:1px solid rgba(220,20,60,.4);color:#ff6b6b}
.status-message.success{background:rgba(0,200,100,.12);border:1px solid rgba(0,200,100,.3);color:#4ade80}

/* Success view */
.success-view{display:none;text-align:center;padding:20px 0}
.success-view.show{display:block}
.success-icon{font-size:80px;display:block;margin-bottom:20px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(0)}100%{transform:scale(1)}}
.success-view h2{font-family:'Montserrat',sans-serif;font-size:28px;font-weight:800;color:var(--red);margin-bottom:12px}
.success-view p{color:var(--light-gray);font-size:15px;margin-bottom:24px;line-height:1.6}
.wait-time-box{background:var(--black);border:2px solid var(--red);border-radius:12px;padding:20px;margin-bottom:24px}
.wait-time-label{font-size:13px;color:var(--light-gray);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.wait-time-value{font-family:'Montserrat',sans-serif;font-size:32px;font-weight:800;color:var(--red)}
.parties-ahead{font-size:14px;color:var(--light-gray);margin-top:12px}
.back-btn{padding:12px 28px;background:var(--black);border:2px solid var(--red);border-radius:8px;color:var(--white);font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s ease;text-decoration:none;display:inline-block}
.back-btn:hover{background:var(--red);transform:translateY(-2px)}

/* No config warning */
.no-config{background:rgba(212,175,55,.1);border:2px solid rgba(212,175,55,.4);border-radius:12px;padding:20px;margin-bottom:20px;text-align:center;color:#D4AF37;font-size:14px;line-height:1.6;display:none}
.no-config a{color:#D4AF37;font-weight:700}

@media(max-width:600px){.card{padding:32px 24px}h1{font-size:28px}}
</style>
</head>
<body>
<div class="container">
  <div class="card">

    <div id="formView">
      <div class="header">
        <span class="logo">🦞</span>
        <h1>Join Waitlist</h1>
        <p class="subtitle">We'll notify you when your table is ready</p>
        <div class="seafood-btn-wrap">
          <a href="live-update-inventory.html" class="seafood-btn">
            <span class="dot"></span>
            🦞 See Live Seafood Status 🔥
          </a>
        </div>
      </div>

      <div class="form-group">
        <label>Name <span class="required">*</span></label>
        <input type="text" id="name" required placeholder="John Smith" autocomplete="name" />
      </div>
      <div class="form-group">
        <label>Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" required placeholder="(469) 555-1234" autocomplete="tel" />
      </div>
      <div class="form-group">
        <label>Party Size <span class="required">*</span></label>
        <input type="number" id="partySize" required min="1" max="20" placeholder="2" />
      </div>
      <div class="form-group">
        <label>Special Requests (Optional)</label>
        <textarea id="notes" placeholder="High chair, booth seating, birthday celebration..."></textarea>
      </div>

      <div class="spicy-meter">
        <div class="spicy-header">🌶️ How Hot Do You Like It? 🌶️</div>
        <div class="spicy-options" id="spicyOptions">
          <button type="button" class="spicy-opt selected" data-level="No Spice">
            <span class="fire"><span class="no-spice-dot"></span></span>
            <span class="fire-label">No<br>Spice</span>
          </button>
          <button type="button" class="spicy-opt" data-level="Mild">
            <span class="fire">🔥</span>
            <span class="fire-label">Mild</span>
          </button>
          <button type="button" class="spicy-opt" data-level="Spicy">
            <span class="fire">🔥🔥</span>
            <span class="fire-label">Spicy</span>
          </button>
          <button type="button" class="spicy-opt" data-level="Turbo Hot">
            <span class="fire">🔥🔥🔥</span>
            <span class="fire-label">Turbo<br>Hot</span>
          </button>
        </div>
      </div>

      <div class="consent-box">
        <div class="checkbox-item">
          <input type="checkbox" id="smsConsent">
          <label for="smsConsent" class="checkbox-label">
            <span class="required">*</span> <strong>I agree to receive text messages</strong> about my waitlist status. Reply STOP to opt out.
          </label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="marketingOptIn">
          <label for="marketingOptIn" class="checkbox-label">
            Send me crawfish updates and specials (optional)
          </label>
        </div>
      </div>

      <button type="button" class="submit-btn" id="submitBtn">Join Waitlist</button>
      <div class="status-message" id="statusMessage"></div>
    </div>

    <div class="success-view" id="successView">
      <span class="success-icon">✅</span>
      <h2>You're on the list!</h2>
      <p>We'll send you a text when your table is ready.</p>
      <div class="wait-time-box">
        <div class="wait-time-label">Estimated Wait Time</div>
        <div class="wait-time-value" id="estimatedWait">Calculating...</div>
        <div class="parties-ahead" id="partiesAhead"></div>
      </div>
      <a href="dodies-complete-demo.html" class="back-btn">← Back to Dashboard</a>
    </div>

  </div>
</div>

<script>
// ── Hardcoded URLs — guest pages work for anyone, no setup needed ─────────
const APPS    = "https://script.google.com/macros/s/AKfycbyQcO1XkUwXUtMYvIpyXUInYkDXbGgWTOyDlGHWpoKkUQ3uukXiMmH1CI_9XiepNXdfVg/exec";
const n8nUrl  = localStorage.getItem('n8nWebhookUrl') || ''; // only needed if you add AI here later

// ── JSONP helper (bypasses CORS completely) ───────────────────────────────────
function jsonpGet(params) {
  return new Promise((resolve, reject) => {
    if (!APPS) { reject(new Error('Apps Script URL not configured. Please visit the Control Center.')); return; }
    const cb  = 'jcb_' + Math.random().toString(36).slice(2);
    const qs  = new URLSearchParams({ ...params, callback: cb }).toString();
    const s   = document.createElement('script');
    s.src     = APPS + '?' + qs;
    const timer = setTimeout(() => { cleanup(); reject(new Error('Request timed out')); }, 10000);
    window[cb] = (data) => { clearTimeout(timer); cleanup(); resolve(data); };
    s.onerror  = () => { clearTimeout(timer); cleanup(); reject(new Error('Network error — check Apps Script URL')); };
    function cleanup() { delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
    document.body.appendChild(s);
  });
}

// ── Spicy meter ───────────────────────────────────────────────────────────────
let selectedSpice = 'No Spice';
document.getElementById('spicyOptions').addEventListener('click', e => {
  const opt = e.target.closest('.spicy-opt');
  if (!opt) return;
  document.querySelectorAll('.spicy-opt').forEach(o => o.classList.remove('selected'));
  opt.classList.add('selected');
  selectedSpice = opt.dataset.level;
});

// ── Status helpers ────────────────────────────────────────────────────────────
const statusMsg = document.getElementById('statusMessage');
function showStatus(msg, type) { statusMsg.textContent = msg; statusMsg.className = 'status-message show ' + type; }
function hideStatus() { statusMsg.className = 'status-message'; }

// ── Phone formatter ───────────────────────────────────────────────────────────
document.getElementById('phone').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '');
  if (v.length <= 3)      v = v.length ? `(${v}` : '';
  else if (v.length <= 6) v = `(${v.slice(0,3)}) ${v.slice(3)}`;
  else                    v = `(${v.slice(0,3)}) ${v.slice(3,6)}-${v.slice(6,10)}`;
  e.target.value = v;
});

// ── Calculate estimated wait ──────────────────────────────────────────────────
function calcWait(ahead) {
  if (ahead <= 2)  return { time: '5-15 min',  msg: `${ahead} ${ahead===1?'party':'parties'} ahead of you` };
  if (ahead <= 4)  return { time: '15-25 min', msg: `${ahead} parties ahead of you` };
  if (ahead <= 6)  return { time: '30-40 min', msg: `${ahead} parties ahead of you` };
  return               { time: '45-60 min', msg: `${ahead} parties ahead of you` };
}

// ── Submit ────────────────────────────────────────────────────────────────────
document.getElementById('submitBtn').addEventListener('click', async () => {
  hideStatus();

  const name       = document.getElementById('name').value.trim();
  const phoneRaw   = document.getElementById('phone').value.trim();
  const phone      = phoneRaw.replace(/\D/g, '');
  const partySize  = document.getElementById('partySize').value.trim();
  const notes      = document.getElementById('notes').value.trim();
  const smsConsent = document.getElementById('smsConsent').checked;
  const marketing  = document.getElementById('marketingOptIn').checked;

  if (!name || !phone || !partySize)  { showStatus('Please fill out all required fields', 'error'); return; }
  if (phone.length < 10)              { showStatus('Please enter a valid 10-digit phone number', 'error'); return; }
  if (!smsConsent)                    { showStatus('You must agree to receive text messages', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Adding you to the list...';

  try {
    // 1. Get current waitlist count FIRST (so we know position)
    let partiesAhead = 0;
    try {
      const wl = await jsonpGet({ action: 'getWaitlist' });
      if (wl.success && wl.data) {
        partiesAhead = wl.data.filter(p => {
          const s = (p.status || '').trim().toLowerCase();
          return s === 'waiting' || s === 'notified';
        }).length;
      }
    } catch (e) { /* non-fatal — we still add them */ }

    // 2. Add to waitlist
    const result = await jsonpGet({
      action:         'addToWaitlist',
      name:           name,
      phone:          phone,
      partySize:      partySize,
      specialNotes:   notes,
      spiceLevel:     selectedSpice,
      smsConsent:     'Yes',
      marketingOptIn: marketing ? 'Yes' : 'No'
    });

    if (!result.success) throw new Error(result.error || 'Failed to add to waitlist');

    // 3. Show success
    document.getElementById('formView').style.display = 'none';
    const sv = document.getElementById('successView');
    sv.classList.add('show');
    const est = calcWait(partiesAhead);
    document.getElementById('estimatedWait').textContent = est.time;
    document.getElementById('partiesAhead').textContent  = est.msg;

  } catch (err) {
    showStatus('❌ ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Join Waitlist';
  }
});
</script>
</body>
</html>
