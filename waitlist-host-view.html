<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dodie's Host View</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:#0b0505;color:#fff;padding:18px}
    .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{padding:10px 12px;border-radius:10px;border:1px solid #7b5b22;background:#1a0c0c;color:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .pill{padding:7px 10px;border-radius:999px;border:1px solid #7b5b22;background:#120808;cursor:pointer}
    .pill.active{background:#2a140b}
    .grid{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    .card{border:1px solid #3a2b12;border-radius:14px;background:#120808;padding:12px;display:flex;justify-content:space-between;gap:12px}
    .name{font-weight:900}
    .muted{opacity:.75;font-size:13px;margin-top:4px}
    .tag{margin-top:8px;font-size:12px;opacity:.85}
    .acts{display:flex;flex-direction:column;gap:8px;min-width:150px}
    .small{font-size:12px;opacity:.75;margin-top:10px}
    code{color:#ffd88a}
  </style>
</head>
<body>

<div class="bar">
  <button id="refresh">Refresh</button>
  <span class="pill active" data-filter="active">Active</span>
  <span class="pill" data-filter="waiting">Waiting</span>
  <span class="pill" data-filter="notified">Notified</span>
  <span class="pill" data-filter="seated">Seated</span>
  <span class="pill" data-filter="no show">No Show</span>
  <span class="pill" data-filter="cancelled">Cancelled</span>
  <span class="pill" data-filter="all">All</span>
</div>

<div class="small">Apps Script: <code id="u"></code></div>
<div class="small" id="statusLine">Loading…</div>

<div class="grid" id="list"></div>

<script>
  // Hardcode your working /exec URL
  const APPS = "https://script.google.com/macros/s/AKfycbzI2geyAIRUibKJwRmFQvgUGPN2EFfdX04d_vz40F3xk0w26QfhBNDnN9loYhMgaGbuYw/exec";
  document.getElementById("u").textContent = APPS;

  const listEl = document.getElementById("list");
  const statusLine = document.getElementById("statusLine");
  const refreshBtn = document.getElementById("refresh");

  let currentFilter = "active";
  let cache = [];

  // JSONP helper (CORS-proof)
  function jsonp(params){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const qs = new URLSearchParams({ ...params, callback: cb }).toString();
      const s = document.createElement("script");
      s.src = APPS + "?" + qs;

      window[cb] = (data) => {
        cleanup();
        resolve(data);
      };

      s.onerror = () => {
        cleanup();
        reject(new Error("JSONP load failed (deployment/access/url)"));
      };

      function cleanup(){
        delete window[cb];
        if (s.parentNode) s.parentNode.removeChild(s);
      }

      document.body.appendChild(s);
    });
  }

  function norm(s){ return String(s||"").trim().toLowerCase(); }

  function applyFilter(items){
    if (currentFilter === "all") return items;
    if (currentFilter === "active") return items.filter(p => ["waiting","notified"].includes(norm(p.status)));
    return items.filter(p => norm(p.status) === currentFilter);
  }

  async function refresh(){
    refreshBtn.disabled = true;
    statusLine.textContent = "Loading…";
    try{
      const r = await jsonp({ action:"getWaitlist" });
      if (!r.success) throw new Error(r.error || "API error");
      cache = r.data || [];
      render();
    }catch(e){
      statusLine.textContent = "Error: " + e.message;
      listEl.innerHTML = "";
    }finally{
      refreshBtn.disabled = false;
    }
  }

  async function setStatus(row, status){
    refreshBtn.disabled = true;
    try{
      const r = await jsonp({ action:"updateWaitlistStatus", row:String(row), status:String(status) });
      if (!r.success) throw new Error(r.error || "Update failed");
      await refresh();
    }catch(e){
      statusLine.textContent = "Error: " + e.message;
    }finally{
      refreshBtn.disabled = false;
    }
  }

  function render(){
    const items = applyFilter(cache);
    const counts = {
      total: cache.length,
      waiting: cache.filter(p=>norm(p.status)==="waiting").length,
      notified: cache.filter(p=>norm(p.status)==="notified").length,
      seated: cache.filter(p=>norm(p.status)==="seated").length
    };
    statusLine.textContent = `Total ${counts.total} • Waiting ${counts.waiting} • Notified ${counts.notified} • Seated ${counts.seated}`;

    listEl.innerHTML = "";
    if (!items.length){
      listEl.innerHTML = `<div class="card" style="grid-column:1/-1">No parties for this filter.</div>`;
      return;
    }

    for (const p of items){
      const card = document.createElement("div");
      card.className = "card";

      const left = document.createElement("div");
      left.innerHTML = `
        <div class="name">${(p.name||"—")} (Party ${p.party||"?"})</div>
        <div class="muted">${p.phone||""}${p.specialNotes ? " • "+p.specialNotes : ""}</div>
        <div class="tag">Status: ${p.status || "—"} • Spice: ${p.spiceLevel || "—"}</div>
      `;

      const acts = document.createElement("div");
      acts.className = "acts";

      const st = norm(p.status);
      if (st === "waiting"){
        acts.append(btn("Notify","Notified"));
        acts.append(btn("Seat","Seated"));
      } else if (st === "notified"){
        acts.append(btn("Seat","Seated"));
        acts.append(btn("Back to Waiting","Waiting"));
      } else {
        acts.append(btn("Back to Waiting","Waiting"));
      }

      function btn(label, status){
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = () => setStatus(p.row, status);
        return b;
      }

      card.append(left, acts);
      listEl.appendChild(card);
    }
  }

  document.querySelectorAll(".pill").forEach(el=>{
    el.addEventListener("click", ()=>{
      document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
      el.classList.add("active");
      currentFilter = el.getAttribute("data-filter");
      render();
    });
  });

  refreshBtn.addEventListener("click", refresh);
  refresh();
</script>

</body>
</html>
